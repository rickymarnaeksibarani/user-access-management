server:
  port: 8080
spring:
  # setting database
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/db_userman?stringtype=unspecified
    username: postgres
    password: user-m4n4gement
  application:
    name: user_management
    version: 2.0.0
  frontend: "*"
  devtools:
    add-properties: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        id:
          uuid:
            generator: org.hibernate.id.UUIDGenerator
        jdbc:
          lob:
            non_contextual_creation: true
        jpa:
          show-sql: true
        connection:
          datasource:
            log-statement: true
    hibernate:
      ddl-auto: create
  mvc:
    validation: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
